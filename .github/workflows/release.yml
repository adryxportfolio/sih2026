name: Release

# Produces the three installable artifacts and attaches them to a GitHub
# Release, so judges download and run them straight from the repo:
#   Samiksha-Officer-<tag>.apk  — the learner app
#   Samiksha-Admin-<tag>.apk    — the administrator app
#   Samiksha-Workspace-Setup-<tag>.exe — the desktop agent workspace
#
# Cost: nothing. GitHub Actions is free for public repositories, and the whole
# toolchain (JDK, Android SDK, Gradle) is preinstalled on the runner image.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag for the release (e.g. v1.0.0)"
        required: false
        default: "v1.0.0-dev"

permissions:
  contents: write

jobs:
  build:
    name: Assemble ${{ matrix.variant }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Two installable products from one codebase. fail-fast off so a problem
      # in one variant still yields the other — at a demo, one working APK beats
      # none.
      fail-fast: false
      matrix:
        variant: [learner, admin]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Write client-safe env
        working-directory: mobile
        # Only EXPO_PUBLIC_* values reach the app. Server secrets (service role,
        # OpenRouter, YouTube) live in Supabase Edge Function secrets and are
        # deliberately absent here — they must never enter an APK.
        run: |
          cat > .env <<EOF
          EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_WORKSPACE_URL=${{ secrets.EXPO_PUBLIC_WORKSPACE_URL }}
          EXPO_PUBLIC_APP_VARIANT=${{ matrix.variant }}
          EOF
          echo "Wrote .env with $(wc -l < .env) client-safe vars"

      - name: Typecheck
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Prebuild native Android project
        working-directory: mobile
        # app.config.js resolves name, package id and icon from this, so it has
        # to be present for prebuild, not only at JS runtime.
        env:
          EXPO_PUBLIC_APP_VARIANT: ${{ matrix.variant }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Generate release keystore
        working-directory: mobile/android/app
        # A generated keystore is fine for hackathon distribution. For Play Store
        # publishing you would commit an encrypted keystore and load it from
        # secrets instead, so updates keep the same signing identity.
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias samiksha \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD || 'samiksha2026' }}" \
            -keypass "${{ secrets.KEYSTORE_PASSWORD || 'samiksha2026' }}" \
            -dname "CN=Samiksha, OU=SIH2026, O=MoSPI Capacity Building, L=New Delhi, S=Delhi, C=IN"

      - name: Configure release signing
        working-directory: mobile/android
        run: |
          # Prebuild leaves gradle.properties without a trailing newline, so an
          # append glues the first key onto the previous line and silently
          # corrupts both it and the property above it.
          printf '\n' >> gradle.properties
          cat >> gradle.properties <<EOF
          SAMIKSHA_UPLOAD_STORE_FILE=release.keystore
          SAMIKSHA_UPLOAD_KEY_ALIAS=samiksha
          SAMIKSHA_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD || 'samiksha2026' }}
          SAMIKSHA_UPLOAD_KEY_PASSWORD=${{ secrets.KEYSTORE_PASSWORD || 'samiksha2026' }}
          EOF
          # Point the release buildType at our generated keystore
          python3 - <<'PYEOF'
          import re, pathlib
          p = pathlib.Path("app/build.gradle")
          s = p.read_text()
          if "SAMIKSHA_UPLOAD_STORE_FILE" not in s:
              # Inside signingConfigs the Groovy delegate is the SigningConfig
              # object, and a bare identifier is resolved against it first — AGP's
              # decorated class raises MissingPropertyException rather than falling
              # through to the project, so gradle.properties is never consulted.
              # project.property() reads them unambiguously, and the hasProperty
              # guard keeps a local debug build working without them.
              block = "\n".join([
                  "signingConfigs {",
                  "        release {",
                  "            if (project.hasProperty('SAMIKSHA_UPLOAD_STORE_FILE')) {",
                  "                storeFile file(project.property('SAMIKSHA_UPLOAD_STORE_FILE'))",
                  "                storePassword project.property('SAMIKSHA_UPLOAD_STORE_PASSWORD')",
                  "                keyAlias project.property('SAMIKSHA_UPLOAD_KEY_ALIAS')",
                  "                keyPassword project.property('SAMIKSHA_UPLOAD_KEY_PASSWORD')",
                  "            }",
                  "        }",
              ])
              s = s.replace("signingConfigs {", block, 1)
              s = re.sub(
                  r"(buildTypes\s*\{[\s\S]*?release\s*\{[\s\S]*?)signingConfig signingConfigs\.debug",
                  r"\1signingConfig signingConfigs.release",
                  s, count=1)
              p.write_text(s)
              print("release signing wired into build.gradle")
          PYEOF

      - name: Verify gradle.properties parses
        working-directory: mobile/android
        run: |
          echo "--- tail of gradle.properties ---"
          tail -8 gradle.properties
          # Every non-comment line must be a clean key=value. A glued line is
          # the failure this guards against, and it is invisible by eye.
          if grep -nE '^[^#=]+=.*[A-Z_]+=' gradle.properties; then
            echo "ERROR: a property line contains a second '=' assignment — keys were concatenated"
            exit 1
          fi
          echo "gradle.properties looks clean"

      - name: Build release APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Show APK output on failure
        if: failure()
        run: |
          echo "--- looking for any built APK ---"
          find mobile/android -name "*.apk" 2>/dev/null || true
          echo "--- gradle build dir ---"
          ls -la mobile/android/app/build/outputs 2>/dev/null || echo "no outputs directory"


      - name: Rename artifact
        id: artifact
        run: |
          SRC=mobile/android/app/build/outputs/apk/release/app-release.apk
          TAG="${{ github.event.inputs.release_tag || github.ref_name }}"
          case "${{ matrix.variant }}" in
            admin) OUT="Samiksha-Admin-${TAG}.apk" ;;
            *)     OUT="Samiksha-Officer-${TAG}.apk" ;;
          esac
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> $GITHUB_OUTPUT
          echo "tag=$TAG"  >> $GITHUB_OUTPUT
          echo "size=$(du -h "$OUT" | cut -f1)" >> $GITHUB_OUTPUT
          echo "Built $OUT ($(du -h "$OUT" | cut -f1))"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: samiksha-apk-${{ matrix.variant }}
          path: ${{ steps.artifact.outputs.path }}
          retention-days: 90

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.artifact.outputs.tag }}
          name: Samiksha ${{ steps.artifact.outputs.tag }}
          files: ${{ steps.artifact.outputs.path }}
          generate_release_notes: true
          body: |
            ## Samiksha — AI Capacity Building for India's Official Statistical System

            **Smart India Hackathon 2026 · Problem Statement SIH26101**

            ### Install
            1. Download `${{ steps.artifact.outputs.path }}` below (${{ steps.artifact.outputs.size }})
            2. On your Android phone, allow **Install unknown apps** for your browser or file manager
            3. Open the downloaded file and install
            4. Tap **Explore the demo** to see the full journey — no account or network needed

            Minimum Android 7.0 (API 24).

            ### What's inside
            - FRAC-aligned competency gap analysis (deterministic scoring + AI interpretation)
            - MCQ generation from uploaded material, with verbatim-quote grounding checks
            - FSRS-6 spaced repetition, verified against the reference implementation
            - iGOT Karmayogi adapter built on the Sunbird ED contract
            - AI-vetted YouTube tutoring via the official embedded player

  desktop:
    name: Build Windows desktop app
    runs-on: windows-latest
    timeout-minutes: 60
    # Independent of the APKs on purpose. The Electron build pulls the whole
    # workspace monorepo, so if it breaks the two Android artifacts still ship —
    # at a demo, two working installers beat an all-or-nothing release.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        working-directory: workspace
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        working-directory: workspace
        run: pnpm db:generate

      - name: Typecheck
        working-directory: workspace
        run: pnpm check

      - name: Build desktop installer
        working-directory: workspace
        # --publish never: this workflow attaches the artifact itself rather
        # than letting electron-builder talk to the releases API.
        run: pnpm --filter @samiksha/desktop release

      - name: Collect installer
        id: installer
        shell: bash
        run: |
          TAG="${{ github.event.inputs.release_tag || github.ref_name }}"
          SRC=$(find workspace/apps/desktop/out -maxdepth 1 -name "*.exe" | head -1)
          if [ -z "$SRC" ]; then echo "No installer produced"; exit 1; fi
          OUT="Samiksha-Workspace-Setup-${TAG}.exe"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> $GITHUB_OUTPUT
          echo "tag=$TAG"  >> $GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: samiksha-desktop
          path: ${{ steps.installer.outputs.path }}
          retention-days: 90

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.installer.outputs.tag }}
          files: ${{ steps.installer.outputs.path }}
